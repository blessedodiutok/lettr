name: CI

on:
  push:
    branches: [main, vercel-portfolio]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @lettr/api exec prisma generate
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      - run: pnpm turbo run typecheck lint test
      - name: Build web
        run: pnpm --filter @lettr/web build
      - name: Bundle mobile (Android)
        run: pnpm --filter @lettr/mobile exec expo export --platform android --output-dir /tmp/mobile-export
        env:
          CI: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lettr_user
          POSTGRES_PASSWORD: lettr_dev_password
          POSTGRES_DB: lettr_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lettr_user -d lettr_db" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lettr_user:lettr_dev_password@localhost:5432/lettr_db?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SCHEDULER_ENABLED: "false"
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare database
        working-directory: apps/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec tsx --tsconfig prisma/tsconfig.seed.json prisma/seed.ts
      - name: Start API (simulated Paystack, emails printed to log)
        working-directory: apps/api
        run: |
          nohup pnpm exec tsx --conditions=lettr-source src/index.ts > /tmp/api.log 2>&1 &
          npx wait-on http://localhost:4000/api/health --timeout 60000
      - name: Build and start web
        run: |
          pnpm --filter @lettr/web build
          nohup pnpm --filter @lettr/web start -p 3000 > /tmp/web.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 60000
      - name: Install browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Fetch test fixtures
        run: |
          mkdir -p apps/web/e2e/fixtures
          curl -sL -o apps/web/e2e/fixtures/flat.jpg "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=70&fm=jpg"
          curl -sL -o apps/web/e2e/fixtures/room.jpg "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=900&q=70&fm=jpg"
          printf '%%PDF-1.4\n%%%%EOF\n' > apps/web/e2e/fixtures/id.pdf
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_LOG: /tmp/api.log
      - name: Upload logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            /tmp/api.log
            /tmp/web.log
            apps/web/test-results

  demo:
    name: Portfolio demo (Playwright)
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lettr_user
          POSTGRES_PASSWORD: lettr_dev_password
          POSTGRES_DB: lettr_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lettr_user -d lettr_demo" --health-interval 5s --health-retries 10
    env:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://lettr_user:lettr_dev_password@localhost:5432/lettr_demo?schema=public
      TEST_DATABASE_URL: postgresql://lettr_user:lettr_dev_password@localhost:5432/lettr_demo?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-long
      CRON_SECRET: ci-cron-secret
      API_INTERNAL_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The same commands Vercel runs (see apps/web/vercel.json).
      - run: npx --yes pnpm@11.3.0 install --frozen-lockfile --filter . --filter "@lettr/web..."
      - run: node scripts/vercel-build.mjs
      - name: Key-value store against a real database
        run: pnpm --filter @lettr/api exec vitest run src/lib/postgresStore.test.ts
      - name: Start the demo
        working-directory: apps/web
        run: |
          nohup pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &
          npx wait-on http://localhost:3000/api/health --timeout 60000
      - name: Install browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        run: pnpm exec playwright test e2e/demo.spec.ts --workers=1
        env:
          E2E_DEMO: "1"
          E2E_BASE_URL: http://localhost:3000
      - name: Package with Vercel's own builder
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<'JSON'
          {"projectId":"prj_ci","orgId":"team_ci","settings":{"framework":"nextjs","rootDirectory":"apps/web","sourceFilesOutsideRootDirectory":true,"nodeVersion":"22.x"}}
          JSON
          npx --yes vercel@65.11.0 build --prod --yes
          node -e "const c=JSON.parse(require('fs').readFileSync('.vercel/output/config.json'));if(!c.crons?.some((j)=>j.path==='/api/demo/reset'))throw new Error('The nightly reset is missing from the build');console.log('crons',JSON.stringify(c.crons))"
          du -sh .vercel/output/functions
        env:
          VERCEL_ENV: production
          VERCEL_TELEMETRY_DISABLED: "1"
      - name: Upload logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifacts
          path: |
            /tmp/web.log
            apps/web/test-results
