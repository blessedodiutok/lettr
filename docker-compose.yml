# Local services for development: PostgreSQL and Redis.
#   docker compose up -d
# The API also runs without Redis (in-memory fallback), but use Redis to match production.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lettr_user
      POSTGRES_PASSWORD: lettr_dev_password
      POSTGRES_DB: lettr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lettr_user -d lettr_db"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
